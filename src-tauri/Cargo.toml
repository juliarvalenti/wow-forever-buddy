[package]
name = "wow-forever-buddy"
version = "0.3.1"
description = "A companion app for World of Warcraft: Forever"
authors = ["Julia Valenti"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wow_forever_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Two instances would race on settings, backups and game-file writes.
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
dunce = "1"
walkdir = "2"
# Bundled SQLite: no system library needed on Windows.
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
# RC crates are pinned exactly; bump deliberately (spec §8, fallback is ts-rs).
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
memchr = "2"
# Windows Credential Manager / macOS Keychain (spec §7). Without these features
# keyring silently falls back to an in-memory mock store.
keyring = { version = "3", features = ["windows-native", "apple-native"] }
secrecy = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
chrono = "0.4"
blake3 = "1"
zstd = "0.14"
ulid = "3"
# "Export snapshot as .zip" (spec §5). Deflate only: plain zips any OS opens.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs", "chrono"] }
# Auctionator's price database (F5): modern clients store each realm's prices
# as a CBOR string (C_EncodingUtil.SerializeCBOR) inside its SavedVariables.
ciborium = "0.2"
# Item icons from the game's CASC storage: BLTE chunks are zlib, icons are
# re-encoded as PNG. Both were already in the tree (zip, tauri).
flate2 = "1"
png = "0.18"

[dev-dependencies]
full_moon = "3"
proptest = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
# Install detection reads Blizzard's install path from HKLM (spec §1).
winreg = "0.56"
