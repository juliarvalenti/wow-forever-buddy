[package]
name = "wow-forever-buddy"
version = "0.1.0"
description = "A companion app for World of Warcraft: Forever"
authors = ["Julia Valenti"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wow_forever_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
dunce = "1"
walkdir = "2"
# Bundled SQLite: no system library needed on Windows.
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
# RC crates are pinned exactly; bump deliberately (spec §8, fallback is ts-rs).
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[target."cfg(windows)".dependencies]
# Install detection reads Blizzard's registry keys.
winreg = "0.56"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
