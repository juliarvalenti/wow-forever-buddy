# Publishing a GitHub release builds the Windows app and attaches it to that
# release: an installer (*-setup.exe) and a portable .exe you can run directly.
# "Run workflow" on the Actions tab builds the same thing as a downloadable
# workflow artifact, without touching any release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# Needed to attach files to the release. Every action below runs with this
# token, which is why each one is pinned to a full commit SHA (a tag can be
# moved to other code); the comment says which release it is.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          uploadPlainBinary: true
          uploadWorkflowArtifacts: true
