# Publishing a GitHub release builds the Windows app and attaches it to that
# release: an installer (*-setup.exe), a portable .exe you can run directly,
# and the ForeverBuddy addon on its own (ForeverBuddy-<addon version>.zip, to
# unzip into Interface/AddOns). "Run workflow" on the Actions tab builds the
# same things as downloadable workflow artifacts, without touching any
# release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# Needed to attach files to the release. Every action below runs with this
# token, which is why each one is pinned to a full commit SHA (a tag can be
# moved to other code); the comment says which release it is.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          uploadPlainBinary: true
          uploadWorkflowArtifacts: true

      # BUG-MCP: the release exe (a Windows GUI-subsystem program, unlike the
      # test build) started the way an agent client starts it, over pipes.
      # It runs after the upload, so a failure marks the release job red
      # rather than holding the files back.
      - name: Agent connection works on the release exe
        shell: pwsh
        working-directory: src-tauri
        env:
          MCP_EXE: ${{ github.workspace }}\src-tauri\target\release\wow-forever-buddy.exe
        run: cargo test --locked --test mcp_stdio

      # The addon the app bundles, as a zip whose root is the ForeverBuddy
      # folder, named for the version in its TOC. 7-Zip (on the runner) writes
      # forward-slash entry names, which every unzipper reads as folders.
      - name: Zip the ForeverBuddy addon
        id: addon
        shell: pwsh
        run: |
          $toc = Get-Content src-tauri/resources/addon/ForeverBuddy/ForeverBuddy.toc
          $version = ($toc | Select-String '^## Version:\s*(\S+)').Matches[0].Groups[1].Value
          if (-not $version) { throw "No '## Version:' line in ForeverBuddy.toc" }
          $zip = "ForeverBuddy-$version.zip"
          Push-Location src-tauri/resources/addon
          7z a -tzip "$env:GITHUB_WORKSPACE/$zip" ForeverBuddy
          if ($LASTEXITCODE -ne 0) { throw "7z failed" }
          Pop-Location
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Attach the addon to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          ZIP: ${{ steps.addon.outputs.zip }}
        run: gh release upload "$env:TAG" "$env:ZIP" --clobber

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.addon.outputs.zip }}
          path: ${{ steps.addon.outputs.zip }}
