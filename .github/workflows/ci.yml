# Checks Windows (the real target) and macOS (where development also happens).
# Releases are built separately by release.yml.
#
# Every PR to main and every push to main runs both OSes (the repo is public,
# so standard runners are free). Docs- and design-only changes skip CI, and a
# newer push cancels the run it replaces.
name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "design/**"
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "design/**"
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: CI only builds and tests. (The repo is public, so a PR
# from a fork must never get a token that can push.)
permissions:
  contents: read

env:
  # No debug info in test builds: much faster Windows compiles, smaller cache.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Actions are pinned to full commit SHAs (a tag can be moved to other
    # code); the comment says which release it is. Bump them deliberately.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Only main writes the cache, so PRs always restore a warm one instead of
      # each branch saving its own copy.
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      # tauri::generate_context! needs the frontend dist folder to exist.
      - run: npm run build

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      # --locked: a Cargo.lock that drifted from Cargo.toml fails instead of
      # being silently re-resolved (matters with the exact RC pins).
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      # cargo test regenerates src/lib/bindings.ts; fail if it wasn't committed.
      - name: bindings up to date
        shell: bash
        run: git diff --exit-code -- src/lib/bindings.ts
