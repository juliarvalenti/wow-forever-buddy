<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Characters, no addon yet — WoW Forever Buddy (mock r3)</title>
<link rel="stylesheet" href="_d.css">
<style>
  /* v0.1: names + realm come from WTF\Account\<ACC>\<Realm>\<Char>; last played from folder mtime.
     Class, level, gold, satchels need the addon, shown as quiet placeholders, never as zeros. */
  .banner { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: var(--r); font-size: 12.5px; color: var(--chalk);
    background: rgba(0,0,0,.22); box-shadow: inset 0 2px 5px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.04); }
  .banner svg { color: #b79c6c; }
  .banner b { color: var(--chalk-hi); font-weight: 600; }
  .banner .grow { color: var(--ash); }
  .banner a { display: inline-flex; align-items: center; gap: 3px; color: var(--ember-2); white-space: nowrap; font-size: 12px; }

  .toolbar { display: flex; align-items: center; gap: 10px; }
  .toolbar .field { flex: 1; max-width: 560px; height: 34px; opacity: .55; cursor: not-allowed; }
  .toolbar .field input { cursor: not-allowed; }
  .toolbar .field svg { color: var(--soot); }
  .toolbar .hint { font-size: 11.5px; color: var(--soot); }
  .toolbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ash); }
  .totals { font-size: 12px; color: var(--ash); }
  .totals b { color: var(--chalk-hi); font-weight: 600; font-size: 13px; }

  /* same card anatomy as characters.html: identity · progress · facts */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 12px; }
  .card { display: grid; grid-template-rows: 80px 34px auto; gap: 10px; padding: 12px 13px 12px; }
  .card .id { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .card .id > div { min-width: 0; }
  .card .nm { font: 700 15px/1.2 "Cinzel", serif; color: var(--chalk); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .cl { font-size: 11.5px; color: var(--soot); white-space: nowrap; }
  .card .loc { font-size: 11px; color: var(--soot); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* neutral portrait: stone slot with a plain silhouette, no class tint, no crest */
  .blank { width: 64px; aspect-ratio: 4 / 5; flex-shrink: 0; border-radius: 5px; padding: 3px;
    background: var(--grit), linear-gradient(160deg, #57524b, #2a2724 40%, #151413 70%, #3a3632); box-shadow: 0 0 0 1px #000, inset 0 1px 0 rgba(255,255,255,.15), 0 4px 10px rgba(0,0,0,.55); }
  .blank > span { display: grid; place-items: end center; width: 100%; height: 100%; border-radius: 3px; overflow: hidden;
    background: radial-gradient(circle at 50% 32%, #2a2622, #0d0c0b 78%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.85), inset 0 0 12px rgba(0,0,0,.7); }
  .blank svg { width: 46px; height: 56px; fill: rgba(205,191,169,.16); }
  .prog { display: grid; gap: 5px; align-content: center; }
  .prog .lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--soot); }
  .prog .lbl i { font-style: normal; color: #8f7d66; }
  .nobar { height: 6px; border-radius: 3px; border: 1px dashed rgba(205,191,169,.18); }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); padding-top: 9px; border-top: 1px solid rgba(0,0,0,.5); box-shadow: inset 0 1px 0 rgba(255,255,255,.03); }
  .facts div { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--soot); white-space: nowrap; }
  .facts b { display: block; font: 500 13px "Geist", sans-serif; letter-spacing: 0; text-transform: none; color: #4f4a42; margin-top: 1px; }
</style>
</head>
<body data-page="characters" data-wow="running" data-addon="none">
<main class="main">
  <header class="head">
    <div><h1>Characters</h1><div class="lede">Found in your WTF folder. Class, level and gold appear once the addon has seen each character.</div></div>
    <div class="actions totals"><span><b>7</b> characters · <b>1</b> realm</span></div>
  </header>

  <div class="banner">
    <i data-i="puzzle"></i>
    <span class="grow"><b>Install the ForeverBuddy addon</b> to see class, level, gold and satchels for every alt.</span>
    <a href="dashboard-noaddon.html">How to install <i data-i="chevron" class="sm"></i></a>
  </div>

  <div class="toolbar">
    <label class="field" title="Search reads satchels, bank and mail, which needs the addon"><i data-i="search"></i><input disabled placeholder="Search every satchel, bank and mailbox…"></label>
    <span class="hint">Needs the addon</span>
    <div class="right">Sort <div class="seg"><button>Name</button><button class="on">Last played</button></div></div>
  </div>

  <section class="cards" id="cards"></section>
</main>
<script>
  const SIL = '<svg viewBox="0 0 40 50"><circle cx="20" cy="18" r="8"/><path d="M4 50c0-13 7-19 16-19s16 6 16 19z"/></svg>';
  const C = [
    ['Thrandor', 'today, 22:52'], ['Velyra', 'yesterday'], ['Coinpurse', '2 days ago'], ['Brannic', '2 days ago'],
    ['Sela', '3 days ago'], ['Fizzwick', '6 days ago'], ['Kaelor', '12 days ago'],
  ];
  document.getElementById('cards').innerHTML = C.map(([n, lp]) => `
    <div class="panel card">
      <div class="id"><span class="blank"><span>${SIL}</span></span><div><div class="nm">${n}</div><div class="cl">Ashenvale</div><div class="loc">Last played ${lp}</div></div></div>
      <div class="prog"><div class="lbl"><span>Level &amp; experience</span><i>needs addon</i></div><div class="nobar"></div></div>
      <div class="facts"><div>Gold<b>—</b></div><div>Satchels<b>—</b></div><div>Played<b>—</b></div></div>
    </div>`).join('');
</script>
<script src="_shell.js"></script>
</body>
</html>
