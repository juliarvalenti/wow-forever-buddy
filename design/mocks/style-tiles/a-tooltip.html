<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Style tile A · Tooltip</title>
<link rel="stylesheet" href="_base.css">
<style>
  /* A · TOOLTIP — the in-game item tooltip as the whole material: blue-black glass,
     cool steel borders, white text, quality colors, WoW yellow (#ffd100) only for headers/money. */
  :root {
    --ink: #ffffff; --mute: #9da3b8; --dim: #646a80;
    --yellow: #ffd100; --green: #1eff00; --red: #ff3b30;
    --steel-hi: #a9afc0; --steel: #6c7184; --steel-lo: #2a2e3d;
    --glass: rgba(9, 12, 28, 0.94);
    --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .6  0 0 0 0 .7  0 0 0 0 1  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  body { color: var(--ink); background: #04050a; }
  .titlebar { background: #020307; color: var(--dim); border-bottom: 1px solid #141826; }
  .tb-crest { color: var(--steel-hi); }

  .side {
    background: var(--grain), linear-gradient(180deg, #0b1022, #060812 70%);
    border-right: 1px solid #000; box-shadow: inset -1px 0 0 var(--steel-lo), 1px 0 0 #1b2030;
  }
  .brand .mark { color: var(--steel-hi); border: 1px solid var(--steel); border-radius: 5px; background: linear-gradient(180deg, #1a2040, #0a0d1c); box-shadow: inset 0 1px 0 rgba(255,255,255,.15); }
  .brand .name { font-weight: 700; color: var(--yellow); text-shadow: 1px 1px 0 #000; }
  .brand .sub { color: var(--dim); }
  .nav-group { color: var(--dim); }
  .nav-item { color: #c8ccd8; }
  .nav-item svg { color: var(--steel); }
  .nav-item:hover { background: rgba(120, 140, 220, 0.08); }
  .nav-item .n { color: var(--dim); }
  .nav-item.soon { color: var(--dim); }
  /* selection like a highlighted line in the quest log: additive blue light, yellow text */
  .nav-item.active { color: var(--yellow); background: linear-gradient(90deg, rgba(84, 120, 255, 0.32), rgba(84, 120, 255, 0.04)); box-shadow: inset 0 0 0 1px rgba(130, 160, 255, 0.18); text-shadow: 1px 1px 0 #000; }
  .nav-item.active svg { color: var(--yellow); }
  .status { background: var(--glass); border: 1px solid var(--steel); box-shadow: inset 0 0 0 1px #000; color: var(--mute); }
  .status b { color: var(--ink); font-weight: 500; }
  .live { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .okdot { background: var(--green); opacity: .7; }

  .main { background: var(--grain), radial-gradient(900px 500px at 75% -10%, rgba(60, 80, 170, 0.18), transparent 60%), radial-gradient(600px 400px at 0% 100%, rgba(30, 40, 90, 0.25), transparent 70%), #05060c; }
  .head { border-bottom: 1px solid #1b2030; box-shadow: 0 1px 0 #000; }
  .head h1 { font-weight: 700; color: var(--ink); text-shadow: 1px 1px 0 #000; letter-spacing: -0.01em; }
  .lede { color: var(--mute); }

  /* the tooltip frame */
  .tile, .panel {
    background: var(--grain), linear-gradient(180deg, rgba(20, 26, 56, 0.96), var(--glass) 40%);
    border: 1px solid var(--steel); border-radius: 6px;
    box-shadow: inset 0 0 0 1px #000, inset 0 1px 0 1px rgba(200, 210, 255, 0.10), 0 8px 24px rgba(0,0,0,0.6);
  }
  .tile .k { color: var(--yellow); letter-spacing: 0; text-transform: none; font-size: 12px; font-weight: 600; text-shadow: 1px 1px 0 #000; }
  .tile .s { color: var(--mute); }
  .tile .spark { stroke: var(--green); opacity: .8; }
  .up { color: var(--green); }
  .tile .v small { color: var(--mute); }

  .ph { border-bottom: 1px solid rgba(108, 113, 132, 0.35); }
  .ph h2 { color: var(--yellow); font-size: 13.5px; font-weight: 600; text-shadow: 1px 1px 0 #000; }
  .ph .meta { color: var(--dim); }
  .ph .link { color: #8fb3ff; }

  .btn.ghost { color: #c8ccd8; background: none; border: 1px solid transparent; }
  .btn.ghost:hover { border-color: var(--steel-lo); }
  /* classic red UIPanelButton */
  .primary {
    color: var(--yellow); text-shadow: 1px 1px 0 #000; border-radius: 4px;
    background: linear-gradient(180deg, #b3241a 0%, #7d0f0a 48%, #5c0805 52%, #6e0c08 100%);
    border: 1px solid #1a0201;
    box-shadow: inset 0 0 0 1px rgba(232, 180, 90, 0.55), inset 0 2px 0 rgba(255, 170, 140, 0.35), 0 2px 6px rgba(0,0,0,.6);
  }
  .primary:hover { filter: brightness(1.15); }

  .crest svg { fill: color-mix(in srgb, var(--cc) 35%, #0a0d1c); stroke: var(--steel-hi); stroke-width: 1.2; }
  .crest b { color: var(--cc); text-shadow: 1px 1px 0 #000; }
  .wn { color: var(--cc, #f48cba); }
  .who .wn { color: #f48cba; text-shadow: 1px 1px 0 #000; }
  .wc2 { color: var(--mute); }
  .wc2 .lvl { color: var(--ink); }
  /* delight: the level-up flare */
  .ding-ring { background: radial-gradient(circle, rgba(255, 209, 0, 0.35), rgba(255, 209, 0, 0) 68%); box-shadow: inset 0 0 0 1px rgba(255, 209, 0, 0.5); animation: flare 2.4s ease-in-out infinite; }
  .ding-t { color: var(--yellow); font-weight: 600; text-shadow: 1px 1px 0 #000; }
  .ding-n { color: var(--ink); text-shadow: 0 0 12px rgba(255, 209, 0, 0.9), 1px 1px 0 #000; }
  @keyframes flare { 50% { box-shadow: inset 0 0 0 1px rgba(255, 209, 0, 0.8), 0 0 18px rgba(255, 209, 0, 0.35); } }

  .tally { border: 1px solid rgba(108, 113, 132, 0.35); border-radius: 4px; background: rgba(0,0,0,0.25); }
  .tally > div + div { border-left: 1px solid rgba(108, 113, 132, 0.25); }
  .tally .k { color: var(--dim); }
  .goldline .line { stroke: var(--yellow); }
  .goldline .area { fill: rgba(255, 209, 0, 0.08); }
  .goldline .mark { fill: var(--red); }
  .loot h3 { color: var(--dim); }
  .items .x { color: var(--mute); }
  .repair .nm, .repair .x { color: var(--red); }
  .ico { background: linear-gradient(135deg, #2a2f44, #0a0c16); border: 1px solid currentColor; color: #777; box-shadow: inset 0 0 0 1px #000; }
  .ico b { color: #e6e9f2; font-weight: 700; text-shadow: 1px 1px 0 #000; }
  .q-poor { color: #9d9d9d; } .q-common { color: #ffffff; } .q-uncommon { color: var(--green); } .q-rare { color: #0070dd; } .q-epic { color: #a335ee; }
  .nm.q-rare { color: #3d8bff; }
  .zones { border-top: 1px solid rgba(108, 113, 132, 0.25); color: var(--dim); }
  .zone { color: #c8ccd8; border: 1px solid var(--steel-lo); }

  .checks li + li { border-top: 1px solid rgba(108, 113, 132, 0.18); }
  .checks small { color: var(--dim); }
  .ok { color: var(--green); } .warn { color: var(--yellow); }
  .roster li + li { border-top: 1px solid rgba(108, 113, 132, 0.18); }
  .roster .an { color: var(--cc); }
  .roster .note, .roster .lv { color: var(--dim); }
  .coins .g { color: var(--ink); }

  /* delight: a real item tooltip pinned to the loot list */
  .tt {
    position: absolute; z-index: 5; width: 250px; padding: 9px 11px 10px; font-size: 12.5px; line-height: 1.4;
    background: linear-gradient(180deg, rgba(14, 18, 44, 0.98), rgba(4, 5, 14, 0.98));
    border: 1px solid var(--steel-hi); border-radius: 6px;
    box-shadow: inset 0 0 0 1px #000, inset 0 0 0 2px rgba(108,113,132,0.4), 0 12px 30px rgba(0,0,0,0.75);
    text-shadow: 1px 1px 0 #000;
  }
  .tt .t { font-size: 14px; color: #3d8bff; font-weight: 600; }
  .tt .row { display: flex; justify-content: space-between; }
  .tt .g { color: var(--green); }
  .tt .w { color: #fff; }
  .tt .y { color: var(--yellow); }
  .tt .src { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(108,113,132,0.35); color: var(--mute); font-size: 11.5px; }
</style>
</head>
<body>
<script src="_markup.js"></script>
<script>
  // pin the tooltip next to "Truestrike Shoulders"
  const li = document.querySelector('.items li');
  const tt = document.createElement('div');
  tt.className = 'tt';
  tt.innerHTML = `<div class="t">Truestrike Shoulders</div><div class="w">Binds when picked up</div>
    <div class="row w"><span>Shoulder</span><span>Leather</span></div><div class="w">129 Armor</div>
    <div class="w">+24 Agility</div><div class="w">+11 Stamina</div>
    <div class="g">Equip: Improves your chance to hit by 2%.</div>
    <div class="w">Durability 60 / 60</div><div class="w">Requires Level 58</div>
    <div class="w">Sell Price: <span class="coins"><span class="g" style="color:#fff">2</span><span class="s" style="color:#fff">31</span><span class="c" style="color:#fff">40</span></span></div>
    <div class="src">Looted from Baron Rivendare · Stratholme · 21:47</div>`;
  const recap = document.querySelector('.recap');
  recap.appendChild(tt);
  const r = li.getBoundingClientRect(), p = recap.getBoundingClientRect();
  tt.style.left = (r.left - p.left + 200) + 'px';
  tt.style.top = (r.top - p.top + 4) + 'px';
</script>
</body>
</html>
